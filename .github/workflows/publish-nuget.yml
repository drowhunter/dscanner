name: Publish NuGet Packages

on:
  release:
    types: [published] # Triggers automatically when you create a GitHub Release

jobs:
  deploy:
    runs-on: windows-latest # Use windows-latest since the projects target net10.0-windows
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get OIDC Token
        id: get_token
        uses: actions/id-token-action@v1

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack DirectInputWatcher
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet pack DirectInputWatcher/DirectInputWatcher.csproj -c Release -o ./artifacts /p:Version=$version -p:UseProjectReferences=false --source ./artifacts

      - name: Pack DirectInputWatcher.Configuration
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet pack DirectInputWatcher.Configuration/DirectInputWatcher.Configuration.csproj -c Release -o ./artifacts /p:Version=$version -p:UseProjectReferences=false --source ./artifacts

      - name: Push to NuGet
        run: |
          Get-ChildItem -Path ./artifacts -File | ForEach-Object {
            if ($_.Extension -eq '.nupkg' -or $_.Extension -eq '.snupkg') {
              Write-Host "Pushing: $($_.FullName)"
              dotnet nuget push $_.FullName --skip-duplicates --source https://api.nuget.org/v3/index.json --api-key ${{ steps.get_token.outputs.NUGET_API_KEY }}
            }
          }
